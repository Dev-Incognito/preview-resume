<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circleClipRJ">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
    <linearGradient id="rjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>
  <g clip-path="url(#circleClipRJ)">
    <rect width="100" height="100" fill="url(#rjGrad)" />
    <!-- Royal Sun Motif -->
    <circle cx="50" cy="50" r="22" fill="#FFE082" />
    <circle cx="50" cy="50" r="15" fill="#FFF8E1" />
    <!-- Sun Rays -->
    <g stroke="#FFE082" stroke-width="3" stroke-linecap="round">
      <line x1="50" y1="18" x2="50" y2="24" />
      <line x1="50" y1="76" x2="50" y2="82" />
      <line x1="18" y1="50" x2="24" y2="50" />
      <line x1="76" y1="50" x2="82" y2="50" />
      <line x1="27" y1="27" x2="32" y2="32" />
      <line x1="68" y1="68" x2="73" y2="73" />
      <line x1="27" y1="73" x2="32" y2="68" />
      <line x1="68" y1="32" x2="73" y2="27" />
    </g>
    <!-- Rajasthani text/letter marker 'रा' -->
    <text x="50" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#BF360C" text-anchor="middle" dominant-baseline="central">RJ</text>
  </g>
  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,215,0,0.7)" stroke-width="2.5" />
</svg>