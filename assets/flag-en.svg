<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circleClipUK">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
  </defs>
  <g clip-path="url(#circleClipUK)">
    <rect width="100" height="100" fill="#012169" />
    <!-- White diagonals -->
    <path d="M0 0 L100 100 M100 0 L0 100" stroke="#FFFFFF" stroke-width="18" />
    <!-- Red diagonals -->
    <path d="M0 0 L50 50 M100 0 L50 50 M0 100 L50 50 M100 100 L50 50" stroke="#C8102E" stroke-width="10" />
    <!-- White cross -->
    <path d="M50 0 V100 M0 50 H100" stroke="#FFFFFF" stroke-width="26" />
    <!-- Red cross -->
    <path d="M50 0 V100 M0 50 H100" stroke="#C8102E" stroke-width="16" />
  </g>
  <!-- Subtle gold rim -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(229,184,56,0.5)" stroke-width="2.5" />
</svg>